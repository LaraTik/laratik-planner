name: Release

# Create an immutable GitHub release + tag when an operator manually
# dispatches this workflow for a successful production deploy.
#
# The operator supplies the successful deploy run id, or leaves it blank
# to use the most recent successful deploy.
#
# Tag shape: releases/v<run-id>-<short-sha>
#   - `releases/` prefix keeps the tag list in `git tag -l` separated
#     from any human release tags.
#   - `<run-id>` is the GH Actions run id, which is monotonically
#     increasing and ties the release to a specific deploy run for
#     audit.
#   - `<short-sha>` is the deployed head_sha; ties the release to
#     the git ref.
#
# Why an immutable tag (not just a release):
#   - Tags can be created without deleting previous ones. Each
#     release gets its own tag, and the previous tag is preserved.
#   - The release notes link the deployed SHA + the deploy run, so
#     a maintainer can audit "what was on production at any past
#     time" from the GitHub UI alone.
#
# Permissions: the release job alone gets contents: write to create the
# tag and release. The default workflow token remains read-only elsewhere.

on:
  workflow_dispatch:
    inputs:
      deploy_run_id:
        description: "Deploy workflow run id to release. Defaults to the most recent successful run."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Tag + GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Resolve the head SHA + deploy run
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          # Forward the workflow_dispatch input as a plain env var; the
          # script reads it via $VAR to avoid template-injection.
          DEPLOY_RUN_INPUT: ${{ inputs.deploy_run_id }}
        run: |
          set -euo pipefail
          # Back-fill mode: pull the head_sha from a specific deploy
          # run id (or the most recent successful one if not given).
          if [[ -n "${DEPLOY_RUN_INPUT}" ]]; then
            RUN_ID="${DEPLOY_RUN_INPUT}"
          else
            RUN_ID="$(gh api "repos/${REPOSITORY}/actions/runs?workflow_id=deploy.yml&status=success&per_page=1" \
              --jq '.workflow_runs[0].id')"
          fi
          SHA="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" \
            --jq '.head_sha')"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy run ${RUN_ID} → head_sha ${SHA}"
        timeout-minutes: 2

      - name: Create tag + release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          # Forward the step outputs as env vars to avoid
          # `${{ steps.*.outputs.* }}` template-injection into the
          # shell (zizmor `template-injection`).
          DEPLOY_SHA: ${{ steps.resolve.outputs.sha }}
          DEPLOY_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          SHA="${DEPLOY_SHA}"
          RUN_ID="${DEPLOY_RUN_ID}"
          SHORT_SHA="${SHA:0:9}"
          TAG="releases/v${RUN_ID}-${SHORT_SHA}"

          # Create an immutable tag through the API. Refuse to move an
          # existing tag to a different SHA; a repeated dispatch for the
          # same deploy remains safe and idempotent.
          if EXISTING_SHA="$(gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" \
            --jq '.object.sha' 2>/dev/null)"; then
            :
          else
            # `gh api` writes a structured error body to stdout on 404;
            # reset the captured value so a missing ref follows the create path.
            EXISTING_SHA=""
          fi
          if [[ -z "${EXISTING_SHA}" ]]; then
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${SHA}" >/dev/null
          elif [[ "${EXISTING_SHA}" != "${SHA}" ]]; then
            echo "Refusing to move existing tag ${TAG} from ${EXISTING_SHA} to ${SHA}" >&2
            exit 1
          fi

          # Create or update the release. The deploy URL is in the
          # body for direct audit; the run page is the canonical
          # source of truth.
          DEPLOY_RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it unchanged."
          else
            gh release create "$TAG" \
              --repo "$REPOSITORY" \
              --target "$SHA" \
              --title "Production deploy ${TAG}" \
              --notes "Deployed \`${SHA}\` to \`planner.laratik.com\` on $(date -u +%Y-%m-%dT%H:%M:%SZ).

            - Deploy run: ${DEPLOY_RUN_URL}
            - Source image: \`ghcr.io/laratik/laratik-planner:${SHA}\`
            - Source migrator: \`ghcr.io/laratik/laratik-planner-migrator:${SHA}\`

            Verify production is on this SHA: \`curl -fsS https://planner.laratik.com/api/health | jq .version\`
            " \
              --draft=false
          fi
        timeout-minutes: 3
