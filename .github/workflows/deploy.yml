name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build + push image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/laratik/laratik-planner
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=latest

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ghcr.io/laratik/laratik-planner-migrator:${{ github.event.workflow_run.head_sha }}
            ghcr.io/laratik/laratik-planner-migrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to laratik-vps
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: SSH + deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The VPS-side deploy.sh needs a GHCR credential to pull the
          # private `ghcr.io/laratik/laratik-planner{-migrator}` images.
          # Pipe GHCR_PAT (a fine-grained PAT with read:packages on the
          # LaraTik org) into the script as $GHCR_PAT. The script does
          # `echo "$GHCR_PAT" | docker login ghcr.io -u <user> --password-stdin`
          # before the first pull, then `docker logout` after.
          envs: GHCR_PAT,GHCR_USER
          script: |
            cd /opt/laratik-planner
            git fetch --all --prune
            git checkout ${{ github.event.workflow_run.head_sha }}
            GHCR_USER="$GHCR_USER" GHCR_PAT="$GHCR_PAT" ./scripts/deploy.sh "${{ github.event.workflow_run.head_sha }}"
