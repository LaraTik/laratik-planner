name: Deploy

# Deploy runs only after an operator explicitly dispatches this workflow.
# CI success does not automatically deploy production. As of the 2026-08-26 CI-minimization
# plan, CI runs the deploy-gate (unit quality, migration drill,
# audit, build, Docker smoke, SMTP-cert probe, workflow linters).
# The full integration suite must pass locally on the exact release SHA;
# see docs/testing/strategy.md and ADR 0020.
# Coverage and browser validation run independently in
# `.github/workflows/advisory-quality.yml`; they never control this
# workflow. The operator manually chooses when to deploy.
#
# CI builds, smoke-tests, and publishes the immutable SHA-tagged app and
# migrator images from `main`. This workflow verifies CI succeeded for the
# dispatched `main` SHA, verifies those images exist, then deploys them. It
# does not rebuild. Dispatches from other refs skip all jobs.
#
# See `docs/testing/strategy.md` (Release gates) and
# `docs/operations/runbook.md` (CI vs. local E2E) for the full
# contract.

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    name: Resolve deployment commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout dispatched main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve checked-out commit
        id: resolve
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy to laratik-vps
    runs-on: ubuntu-latest
    needs: resolve
    environment: production
    # Least privilege: actions: read queries successful CI runs and
    # packages: read lets the image verification inspect private GHCR tags.
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Require successful CI for the selected commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${DEPLOY_SHA}" --json conclusion,headSha --limit 100)"
          if ! jq -e --arg sha "${DEPLOY_SHA}" '.[0] | .headSha == $sha and .conclusion == "success"' <<<"${runs}" >/dev/null; then
            echo "Refusing deployment: CI has not succeeded for ${DEPLOY_SHA}."
            exit 1
          fi
          echo "CI succeeded for ${DEPLOY_SHA}."

      - name: Log in to GHCR
        # This workflow has its own runner and must authenticate
        # before inspecting private GHCR images. Without this
        # step the GHA runner falls back to anonymous auth, which
        # GHCR rejects with `401 Unauthorized` on
        # `https://ghcr.io/token?scope=…`. GITHUB_TOKEN with
        # `packages: read` is sufficient for the read-only inspect
        # call. The full GHCR_PAT is forwarded to the VPS over
        # SSH by the `SSH + deploy` step below — that one needs
        # write-ish scopes that the GITHUB_TOKEN alone can't
        # provide on every org config.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists in GHCR
        # Fast-fail in the Actions UI if the image is missing. CI
        # must have pushed it for this exact SHA. If the tag isn't reachable
        # from the GHA runner, `docker buildx imagetools inspect`
        # exits non-zero and we never SSH to the VPS. Cheap
        # (~2-3s) head request, no Docker daemon dependency.
        env:
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          echo "Verifying ghcr.io/laratik/laratik-planner:${DEPLOY_SHA} is reachable…"
          docker buildx imagetools inspect \
            "ghcr.io/laratik/laratik-planner:${DEPLOY_SHA}"
          docker buildx imagetools inspect \
            "ghcr.io/laratik/laratik-planner-migrator:${DEPLOY_SHA}"
          echo "✓ Both images present in GHCR"
        timeout-minutes: 2

      - name: SSH + deploy
        uses: appleboy/ssh-action@v1
        env:
          # The deploy SHA comes from the ref selected at dispatch. It is
          # forwarded to the remote shell as `DEPLOY_SHA` (via appleboy's
          # `envs:`) instead of being expanded inline into the script.
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The VPS-side deploy.sh needs a GHCR credential to pull the
          # private `ghcr.io/laratik/laratik-planner{-migrator}` images.
          # We forward GHCR_PAT / GHCR_USER / DEPLOY_SHA through
          # appleboy/ssh-action's `envs:` (env forwarding over SSH) so
          # the remote script sees them as plain shell variables, not
          # as `${{ secrets.* }}` / `${{ github.event.* }}` template
          # expansions (which would be template-injection sinks).
          envs: GHCR_PAT,GHCR_USER,DEPLOY_SHA
          script: |
            set -euo pipefail
            cd /opt/laratik-planner
            git fetch --all --prune
            git checkout "$DEPLOY_SHA"
            export GHCR_PAT
            export GHCR_USER
            ./scripts/deploy.sh "$DEPLOY_SHA"
