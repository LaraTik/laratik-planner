name: Deploy

# Deploy fires when the authoritative `CI` workflow completes
# successfully on `main`. As of the 2026-08-26 CI-minimization
# plan, CI runs the irreducible deploy-gate (integration,
# coverage, audit, build, Docker smoke, SMTP-cert probe, workflow
# linters). As of the 2026-08-26 "E2E moves local" follow-up, E2E
# runs locally in `.husky/pre-push` (critical subset) and as a
# manual pre-merge step (full 5-browser matrix) — no GitHub
# workflow. The deploy therefore fires on CI green alone; the
# critical E2E is the dev's pre-push signal, the full E2E is the
# dev's pre-merge signal, and `pnpm verify` covers the rest.
#
# As of the 2026-08-28 single-build change, CI's `build-smoke`
# job is the single source of the GHCR push — it builds the
# production image (linux/amd64), smoke-tests it, then publishes
# the same bytes to `ghcr.io/laratik/laratik-planner{<sha>,latest}`
# and the matching `-migrator` image. This workflow no longer
# rebuilds; the `build` job only runs on `workflow_dispatch`
# (the hotfix escape hatch) so an operator can still ship a
# ref without waiting for CI to turn green. On the normal
# `workflow_run` path, the deploy job verifies the GHCR tag
# exists and SSHes to the VPS to pull + run migrations + restart.
# The duplication is gone: previously deploy.yml's `build` job
# did a second full `next build` + `docker build` (~270s wall
# per deploy); now the deploy job runs in ~60s.
#
# The `workflow_dispatch` escape hatch is preserved: a hotfix can
# still dispatch this workflow manually without waiting for CI.
# Use sparingly — it rebuilds the image locally on a GHA runner,
# not on a Linux/amd64 build host, so the produced image is still
# the correct platform.
#
# See `docs/testing/strategy.md` (Release gates) and
# `docs/operations/runbook.md` (CI vs. local E2E) for the full
# contract.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/sha) to deploy. Defaults to the latest main."
        required: false
        default: "main"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build + push image (dispatch only)
    # Per the 2026-08-28 single-build change, this job ONLY runs when
    # an operator dispatches the workflow manually. On the normal
    # `workflow_run` path from CI, the production image is already
    # in GHCR (pushed by CI's `build-smoke` job), so there is nothing
    # to rebuild here. The dispatch path exists so a hotfix to a
    # release-blocker can ship without waiting for CI to turn green
    # (e.g. §23 step 19/20 integration flakes, or a zizmor rule
    # upgrade). Use sparingly — it bypasses the CI gate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/laratik/laratik-planner
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }}
            type=raw,value=latest

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          build-args: |
            APP_VERSION=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: |
            ghcr.io/laratik/laratik-planner-migrator:${{ github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/laratik/laratik-planner-migrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to laratik-vps
    runs-on: ubuntu-latest
    needs: build
    # `if: always() && (...)` lets this job run whether or not the
    # `build` job above actually executed:
    #   - workflow_dispatch: build ran, must have succeeded
    #   - workflow_run from CI: build was skipped (CI already pushed
    #     the image), so we accept either 'success' or 'skipped'
    # This is the standard GHA pattern for "optional dependency".
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    environment: production
    # Least privilege: deploy only needs to read the image that CI's
    # build-smoke (or the dispatch build job above) just pushed.
    # `packages: read` lets the verify-image step call `docker
    # buildx imagetools inspect` against the GHCR tag.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Verify image exists in GHCR
        # Fast-fail in the Actions UI if the image is missing. On
        # the normal path CI pushed it; on the dispatch path the
        # build job above pushed it. If the tag isn't reachable
        # from the GHA runner, `docker buildx imagetools inspect`
        # exits non-zero and we never SSH to the VPS. Cheap
        # (~2-3s) head request, no Docker daemon dependency.
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "Verifying ghcr.io/laratik/laratik-planner:${DEPLOY_SHA} is reachable…"
          docker buildx imagetools inspect \
            "ghcr.io/laratik/laratik-planner:${DEPLOY_SHA}"
          docker buildx imagetools inspect \
            "ghcr.io/laratik/laratik-planner-migrator:${DEPLOY_SHA}"
          echo "✓ Both images present in GHCR"
        timeout-minutes: 2

      - name: SSH + deploy
        uses: appleboy/ssh-action@v1
        env:
          # The deploy SHA is taken from the workflow_run event when the
          # CI workflow triggers us, or from the current workflow_run's
          # github.sha on a manual dispatch. It is forwarded to the
          # remote shell as the env var `DEPLOY_SHA` (via appleboy's
          # `envs:`) instead of being expanded inline into the script,
          # so a hostile head_sha value cannot be evaluated as code.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The VPS-side deploy.sh needs a GHCR credential to pull the
          # private `ghcr.io/laratik/laratik-planner{-migrator}` images.
          # We forward GHCR_PAT / GHCR_USER / DEPLOY_SHA through
          # appleboy/ssh-action's `envs:` (env forwarding over SSH) so
          # the remote script sees them as plain shell variables, not
          # as `${{ secrets.* }}` / `${{ github.event.* }}` template
          # expansions (which would be template-injection sinks).
          envs: GHCR_PAT,GHCR_USER,DEPLOY_SHA
          script: |
            set -euo pipefail
            cd /opt/laratik-planner
            git fetch --all --prune
            git checkout "$DEPLOY_SHA"
            export GHCR_PAT
            export GHCR_USER
            ./scripts/deploy.sh "$DEPLOY_SHA"
