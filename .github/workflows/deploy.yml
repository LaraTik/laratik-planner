name: Deploy

# Deploy fires when the authoritative `CI` workflow completes
# successfully on `main`. As of Task 10, that workflow already runs
# the full release-gate contract — format, lint, typecheck, unit,
# integration, migration, coverage, audit, Chromium critical E2E,
# visual baseline, production build, and Docker smoke — so this
# workflow can stay narrow. The full 5-browser E2E matrix in
# `.github/workflows/e2e.yml` is a required release-candidate check
# on PRs + main but is not on the deploy critical path.
#
# See `docs/testing/strategy.md` (Release gates) and
# `docs/operations/runbook.md` for the full contract.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/sha) to deploy. Defaults to the latest main."
        required: false
        default: "main"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build + push image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/laratik/laratik-planner
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=latest

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          build-args: |
            APP_VERSION=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: |
            ghcr.io/laratik/laratik-planner-migrator:${{ github.event.workflow_run.head_sha }}
            ghcr.io/laratik/laratik-planner-migrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to laratik-vps
    runs-on: ubuntu-latest
    needs: build
    environment: production
    # Least privilege: deploy only needs to read the image that build
    # just pushed. The build job already wrote to GHCR (packages: write
    # on the GITHUB_TOKEN). Deploy just verifies the tag exists.
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH + deploy
        uses: appleboy/ssh-action@v1
        env:
          # The deploy SHA is taken from the workflow_run event when the
          # CI workflow triggers us, or from the current workflow_run's
          # github.sha on a manual dispatch. It is forwarded to the
          # remote shell as the env var `DEPLOY_SHA` (via appleboy's
          # `envs:`) instead of being expanded inline into the script,
          # so a hostile head_sha value cannot be evaluated as code.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The VPS-side deploy.sh needs a GHCR credential to pull the
          # private `ghcr.io/laratik/laratik-planner{-migrator}` images.
          # We forward GHCR_PAT / GHCR_USER / DEPLOY_SHA through
          # appleboy/ssh-action's `envs:` (env forwarding over SSH) so
          # the remote script sees them as plain shell variables, not
          # as `${{ secrets.* }}` / `${{ github.event.* }}` template
          # expansions (which would be template-injection sinks).
          envs: GHCR_PAT,GHCR_USER,DEPLOY_SHA
          script: |
            set -euo pipefail
            cd /opt/laratik-planner
            git fetch --all --prune
            git checkout "$DEPLOY_SHA"
            export GHCR_PAT
            export GHCR_USER
            ./scripts/deploy.sh "$DEPLOY_SHA"
