name: E2E

# Full Playwright suite is automatic on PR + push to main since the
# visual harness is now deterministic (Task 7). The 5-browser
# functional matrix runs in parallel with the dedicated
# `visual-chromium` project; the visual step only fires after the
# functional matrix succeeds so we don't capture baselines for broken
# builds.
#
# Run locally with:
#   pnpm install --frozen-lockfile
#   pnpm db:migrate   # against a planner_test database
#   pnpm test:e2e:isolated
#   pnpm test:visual
#
# The full pipeline is a required release-candidate check on PRs and
# pushes to `main` (plus manual dispatch). It runs the 5-browser
# functional matrix (chromium / firefox / webkit / mobile-chrome /
# mobile-safari) and the dedicated `visual-chromium` project. Visual
# captures only fire after the functional matrix is green so a broken
# build doesn't regenerate baselines. Any required failure uploads
# `playwright-report`, `test-results`, and visual diffs as artifacts.
#
# Production deploy does NOT wait for this workflow — the critical
# visual gate is in `.github/workflows/ci.yml` so the deploy workflow
# only blocks on the Chromium subset (functional + visual baseline).
# See `docs/testing/strategy.md` (Release gates) for the full contract.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner_ci
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test
      AUTH_SECRET: ci_secret_only_not_for_production_xxxxxxxxxxxxxxxx
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ci
      SMTP_PASSWORD: ci-only
      SMTP_FROM: "ci <ci@planner.test>"
      TEST_DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Cache Playwright browsers
        # The 5-browser matrix downloads ~500 MB of browser binaries;
        # cache them by lockfile hash so the release-candidate check
        # stays fast on warm runs.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run functional Playwright matrix (5 browsers, no visual specs)
        run: pnpm test:e2e:isolated
      - name: Run visual regression (visual-chromium only)
        # Visual captures only run after the functional matrix is green,
        # so a broken build doesn't regenerate baselines.
        if: success()
        run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            tests/e2e/visual-regression.spec.ts-snapshots/reference/
            tests/e2e/visual-regression.spec.ts-snapshots/responsive/
          retention-days: 7
