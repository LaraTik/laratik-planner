name: E2E

# Manual full Playwright suite. Runs the 5-browser functional matrix
# (chromium / firefox / webkit / mobile-chrome / mobile-safari) plus
# the dedicated `visual-chromium` project. Visual captures only fire
# after the functional matrix is green so a broken build doesn't
# regenerate baselines. Any failure uploads `playwright-report`,
# `test-results`, and visual diffs as artifacts.
#
# Contract (2026-08-22): E2E + visual regression are NO LONGER in the
# automatic CI pipeline. Developers must run this workflow manually
# via `Actions → E2E → Run workflow` before pushing/merging, and run
# the equivalent commands locally as part of the development loop.
#
# Run locally with:
#   pnpm install --frozen-lockfile
#   pnpm db:migrate   # against a planner_test database
#   pnpm test:e2e:isolated
#   pnpm test:visual
#
# Production deploy does NOT wait for this workflow. The deploy
# pipeline is gated on `.github/workflows/ci.yml` (format / lint /
# typecheck / unit / integration / build / Docker smoke). See
# `docs/testing/strategy.md` (Release gates) for the full contract.

on:
  workflow_dispatch:

# Default deny: every job must opt-in to the GitHub token scopes it
# needs. E2E needs read+write for artifact upload; the per-job
# `permissions:` block grants that. See runbook (Repository protection).
permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      checks: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner_ci
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test
      AUTH_SECRET: ci_secret_only_not_for_production_xxxxxxxxxxxxxxxx
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ci
      SMTP_PASSWORD: ci-only
      SMTP_FROM: "ci <ci@planner.test>"
      TEST_DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Cache Playwright browsers
        # The 5-browser matrix downloads ~500 MB of browser binaries;
        # cache them by lockfile hash so the release-candidate check
        # stays fast on warm runs.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run functional Playwright matrix (5 browsers, no visual specs)
        run: pnpm test:e2e:isolated
      - name: Run visual regression (visual-chromium only)
        # Visual captures only run after the functional matrix is green,
        # so a broken build doesn't regenerate baselines.
        if: success()
        run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            tests/e2e/visual-regression.spec.ts-snapshots/reference/
            tests/e2e/visual-regression.spec.ts-snapshots/responsive/
          retention-days: 7
