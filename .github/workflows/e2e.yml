name: E2E

# The full Playwright suite runs separately from CI so it can be slow
# (5 browser projects × ~28 specs, 10-20 min) without blocking the
# main CI workflow's "success" conclusion — which gates the deploy
# workflow via workflow_run.
#
# This workflow is informative-only. Failures here DO NOT block
# deploy; they are surfaced as a status check on the PR and as a
# workflow run for human review.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner_ci
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test
      AUTH_SECRET: ci_secret_only_not_for_production_xxxxxxxxxxxxxxxx
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ci
      SMTP_PASSWORD: ci-only
      SMTP_FROM: "ci <ci@planner.test>"
      TEST_DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run Playwright tests
        run: pnpm test:e2e:isolated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
