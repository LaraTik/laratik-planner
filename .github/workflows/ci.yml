name: CI

# Authoritative release-gate workflow. The deploy workflow only fires
# when this workflow is green on `main`, so every required release
# contract must run here:
#
#   1. format / lint / typecheck
#   2. unit + target coverage thresholds
#   3. integration + migration drill
#   4. production build + Docker smoke
#   5. zero critical/high production audit findings
#   6. visual regression gate (TEST-03, GAP-FULL-REVIEW-2026-08-25)
#
# Contract (2026-08-22, updated 2026-08-25): the 5-browser E2E matrix
# moved to `.github/workflows/e2e.yml` under `workflow_dispatch` only.
# Visual regression moved back into the gating pipeline as the
# `visual-regression` job (3-viewport matrix) — this is the TEST-03
# fix from the 2026-08-25 gap audit. Developers run the full
# Playwright suite + 5-browser matrix locally before pushing/merging.
# See `docs/testing/strategy.md` (Release gates) for the contract.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Schedule removed 2026-08-23: was a daily 06:00 UTC CI run that also
  # auto-deployed via the deploy.yml workflow_run chain. The SMTP cert
  # check is still exercised on every push to main; if the cert approaches
  # expiry while no one is pushing, `scripts/vps/check-smtp-cert.sh`
  # should be re-enabled on a host-level cron if a daily safety net is
  # required again.

# Cancel in-flight runs of the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default deny: every job must opt-in to the GitHub token scopes it
# needs. This is a defense-in-depth check — see
# docs/operations/runbook.md (Repository protection) for the full contract.
permissions:
  contents: read

jobs:
  unit-quality:
    name: Lint, typecheck, unit, integration, coverage, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner_ci
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Mailpit catches every email the integration tests send
      # (invitation, magic-link, password reset) on 1025 SMTP and
      # exposes them on 8025 HTTP for debug. Without it, SMTP at
      # localhost:1025 (the env below) refuses every connection and
      # the §23 journey fails at step 6 (invite 5 members). The
      # mirror of the service in `docker-compose.dev.yml`.
      mailpit:
        # Pinned to v1.27.4 (latest stable). zizmor rejects `latest` and
        # floating minor tags (e.g. v1.27) per its unpinned-images
        # audit. Keep the comment in `docker-compose.dev.yml` in sync.
        image: axllent/mailpit:v1.27.4
        ports:
          - 1025:1025
          - 8025:8025
        env:
          MP_MAX_MESSAGES: "5000"
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        options: >-
          --health-cmd "wget -qO- http://localhost:8025/api/v1/info >/dev/null 2>&1 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test
      AUTH_SECRET: ci_secret_only_not_for_production_xxxxxxxxxxxxxxxx
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ci
      SMTP_PASSWORD: ci-only
      SMTP_FROM: "ci <ci@planner.test>"
      TEST_DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Defense in depth: the default GITHUB_TOKEN is left in the
          # .git/config after checkout unless we explicitly opt out.
          # `persist-credentials: false` keeps the token out of any
          # subsequent `git` command (e.g. an indirect LFS fetch).
          persist-credentials: false
        timeout-minutes: 5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
        timeout-minutes: 5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15

      - name: Format check
        run: pnpm format:check
        timeout-minutes: 10

      - name: Lint
        run: pnpm lint
        timeout-minutes: 10

      - name: Typecheck
        run: pnpm typecheck
        timeout-minutes: 10

      - name: Apply migrations
        run: pnpm db:migrate
        timeout-minutes: 10

      - name: Unit tests
        run: pnpm test:unit -- --reporter=verbose
        timeout-minutes: 20

      - name: Integration tests
        run: pnpm test:integration
        timeout-minutes: 20

      - name: Coverage
        run: pnpm test:coverage
        timeout-minutes: 20

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
        timeout-minutes: 5

      - name: Dependency audit
        run: pnpm audit --prod
        timeout-minutes: 10

  visual-regression:
    # TEST-03 (GAP-FULL-REVIEW-2026-08-25) — the visual-regression
    # gate. Previously the spec was PENDING on committed baselines and
    # lived only in `.github/workflows/e2e.yml` as a manual
    # `workflow_dispatch` step. This job moves visual regression into
    # the automatic CI pipeline as a required check on push to main.
    #
    # The responsive matrix is reduced to 3 viewports (mobile-s, tablet,
    # wide) per the audit's first suggestion, so the 25-min job budget
    # is sustainable. Baselines are captured by running `pnpm
    # test:visual:update` locally and committing the new PNGs in
    # `tests/e2e/visual-regression.spec.ts-snapshots/{reference,responsive}/`.
    # This job runs in ASSERT mode (no PW_VISUAL_CAPTURE) so a non-zero
    # diff fails the build. The first push after the TEST-03 reduction
    # must include the freshly-captured baselines; without them, the
    # `expect(page).toHaveScreenshot(...)` calls fail on missing
    # reference PNGs. Use the e2e.yml `Run workflow` button to seed
    # the baselines if a clean re-capture is needed.
    name: Visual regression (3-viewport gate)
    runs-on: ubuntu-latest
    needs: [unit-quality]
    # Bumped from 25 → 35 min to absorb the per-test dev compile cost
    # after the file-scope pre-warm was removed (see
    # `Run visual regression (assert mode)` below). The action
    # itself uses 30 min; the extra 5 min is for the surrounding
    # setup (containers, migrations, browser install).
    timeout-minutes: 35
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner_ci
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test
      AUTH_SECRET: ci_secret_only_not_for_production_xxxxxxxxxxxxxxxx
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ci
      SMTP_PASSWORD: ci-only
      SMTP_FROM: "ci <ci@planner.test>"
      TEST_DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
        timeout-minutes: 5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15

      - name: Apply migrations
        run: pnpm db:migrate
        timeout-minutes: 10

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
        timeout-minutes: 3

      - name: Install Playwright Chromium
        # Only the chromium binary is required — the visual-regression
        # spec runs in the `visual-chromium` project (see
        # playwright.config.ts).
        run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 10

      - name: Run visual regression (assert mode)
        # No PW_VISUAL_CAPTURE flag — the spec compares every captured
        # screenshot against the committed baseline and fails the build
        # on any non-zero diff.
        #
        # The previous spec had a file-scope `test.beforeAll` pre-warm
        # that visited every route in a hidden page context to pay the
        # dev compile cost upfront. It was removed in commit 46c97a2 →
        # bfb6db7 because Playwright re-evaluates the spec per worker,
        # which re-ran the pre-warm 3-7× per CI run and blew the
        # 20-min action timeout. The pre-warm's per-test compile
        # saving is now paid by each test directly; the 24 canonical
        # routes × 3 viewports × ~5-10s per cold compile comfortably
        # fits in 30 min, with headroom for the actual screenshot
        # captures.
        run: pnpm test:visual
        timeout-minutes: 30

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            tests/e2e/visual-regression.spec.ts-snapshots/reference/
            tests/e2e/visual-regression.spec.ts-snapshots/responsive/
            test-results/
            playwright-report/
          retention-days: 7
        timeout-minutes: 5

  build-smoke:
    name: Build, Docker image, health smoke
    runs-on: ubuntu-latest
    needs: [unit-quality]
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner_ci
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test
      AUTH_SECRET: ci_secret_only_not_for_production_xxxxxxxxxxxxxxxx
      AGENCY_COOKIE_SECRET: ci_agency_cookie_secret_not_for_production_xxxxxxxxx
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ci
      SMTP_PASSWORD: ci-only
      SMTP_FROM: "ci <ci@planner.test>"
      TEST_DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Defense in depth: the default GITHUB_TOKEN is left in the
          # .git/config after checkout unless we explicitly opt out.
          # `persist-credentials: false` keeps the token out of any
          # subsequent `git` command (e.g. an indirect LFS fetch).
          persist-credentials: false
        timeout-minutes: 5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
        timeout-minutes: 5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15

      - name: Build
        run: pnpm build
        timeout-minutes: 20

      - name: Build Docker image
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA} -t laratik-planner:ci-${{ github.sha }} .
        timeout-minutes: 20

      - name: Smoke e2e (liveness)
        # Smoke-test the production image's process startup. We hit
        # /api/health/live (liveness only — no DB check) so a transient
        # DB hiccup doesn't fail the smoke. Readiness (DB + schema)
        # is verified by the unit-quality + integration jobs above
        # and by Traefik's loadbalancer probe in production.
        #
        # Why 127.0.0.1 (not localhost): IPv6 trap — the GHA runner
        # resolves "localhost" to ::1 first and Next.js binds 0.0.0.0
        # (IPv4), so curl against "localhost" hits nothing. Same trap
        # called out in docker-compose.yml. `--network host` lets the
        # smoke container reach the GHA postgres service via localhost
        # and the published port 3000 of the runner host; the -p flag
        # is intentionally absent because Docker ignores it under
        # host networking anyway (would warn "Published ports are
        # discarded when using host network mode").
        run: |
          docker run -d --rm \
            --network host \
            --name laratik-planner-smoke \
            -e NODE_ENV=production \
            -e AUTH_SECRET=$AUTH_SECRET \
            -e AGENCY_COOKIE_SECRET=$AGENCY_COOKIE_SECRET \
            -e DATABASE_URL=$DATABASE_URL \
            -e AUTH_URL=http://127.0.0.1:3000 \
            -e SMTP_HOST=localhost \
            -e SMTP_USER=ci \
            -e SMTP_PASSWORD=ci-only \
            -e SMTP_FROM='ci <ci@planner.test>' \
            laratik-planner:ci-${{ github.sha }}
          # Wait up to 60s for the liveness endpoint (Next.js standalone
          # boot + first request on a cold GHA runner is ~20-30s in our
          # observed range; 60s leaves comfortable headroom).
          liveness_ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health/live > /dev/null 2>&1; then
              echo "Liveness OK after ${i}s"
              liveness_ok=1
              break
            fi
            sleep 1
          done
          # Always capture logs so post-mortem is easy.
          echo "─── container logs ───"
          docker logs laratik-planner-smoke || true
          echo "─── end container logs ───"
          docker stop laratik-planner-smoke || true
          if [ "$liveness_ok" -ne 1 ]; then
            echo "Smoke test failed: /api/health/live never responded within 60s"
            exit 1
          fi
          # Sanity-check the readiness endpoint exists and returns a
          # JSON body. We don't gate on 200 here because the smoke
          # postgres has no migrations applied (that's the
          # unit/integration job's job to verify). We just confirm the
          # route is wired up.
          echo "─── /api/health/ready body ───"
          curl -sS -o /tmp/ready.json -w "HTTP %{http_code}\n" \
            http://127.0.0.1:3000/api/health/ready || true
          cat /tmp/ready.json 2>/dev/null || true
          echo "─── end /api/health/ready body ───"
        timeout-minutes: 5

  check-smtp-cert:
    # Gates deploys on the production SMTP cert not being within 14
    # days of expiry. Why this is a deploy-gate job: the moment the cert
    # expires, every Nodemailer send (invitation resend, magic-link
    # sign-in, password reset) starts surfacing the raw OpenSSL error
    # "certificate has expired" to the user. We caught it the hard way
    # on 2026-08-22 when the let's-encrypt E7 cert for mail.laratik.com
    # silently went 1 day past notAfter because the ACME container's
    # renewal cron was paused. See `scripts/vps/renew-smtp-cert.sh` for
    # the on-VPS remediation.
    #
    # Exit code contract (see scripts/vps/check-smtp-cert.sh):
    #   0 = healthy (>30d remaining)
    #   1 = warning (14-30d remaining) — soft fail, logs but does not
    #       break the deploy gate
    #   2 = critical (<14d remaining) — hard fail, blocks the deploy
    #       AND pages on-call via the workflow failure notification
    #   3 = TLS handshake / parse error — hard fail
    name: SMTP cert expiry check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Defense in depth: the default GITHUB_TOKEN is left in the
          # .git/config after checkout unless we explicitly opt out.
          # `persist-credentials: false` keeps the token out of any
          # subsequent `git` command (e.g. an indirect LFS fetch).
          persist-credentials: false
        timeout-minutes: 5

      - name: Install openssl (preinstalled on ubuntu-latest, but be explicit)
        run: sudo apt-get update && sudo apt-get install -y openssl ca-certificates
        timeout-minutes: 3

      - name: Run cert-expiry probe (always log JSON, never fail this step)
        # Writes a single JSON line to /tmp/cert.json; the next step
        # reads it for the gate decision.
        id: probe
        run: |
          set +e
          SMTP_HOST=mail.laratik.com SMTP_PORT=465 \
            ./scripts/vps/check-smtp-cert.sh --warn 30 --critical 14 | tee /tmp/cert.json
          echo "exit=$?" | tee -a /tmp/cert.json
          exit 0
        timeout-minutes: 2

      - name: Gate on critical expiry
        # Re-run the script and propagate its exit code as the job
        # result. Exit 2 (critical) or 3 (TLS error) fail the job; exit
        # 1 (warn) is allowed to pass — it pages but does not block.
        run: |
          SMTP_HOST=mail.laratik.com SMTP_PORT=465 \
            ./scripts/vps/check-smtp-cert.sh --warn 30 --critical 14 > /dev/null
        timeout-minutes: 2

      - name: Annotate run with cert status (for the GH Actions UI)
        # Always succeed; just surfaces the JSON in the GH Actions run
        # summary so on-call can read it without re-running locally.
        if: always()
        run: |
          echo "## SMTP cert status" >> $GITHUB_STEP_SUMMARY
          cat /tmp/cert.json 2>/dev/null >> $GITHUB_STEP_SUMMARY \
            || echo '{"note":"cert.json not produced (probe step skipped)"}' >> $GITHUB_STEP_SUMMARY
        timeout-minutes: 1

  lint-meta:
    # Static-analysis linters for the deploy chain itself. Runs in
    # parallel with the heavier unit-quality + build-smoke jobs. Every
    # finding that escapes into `main` is a deploy-time surprise (or a
    # compromised-action class attack); these linters are the cheap
    # guard rail.
    #
    # Coverage:
    #   - actionlint  — syntax / structural checks on the 3 workflows
    #   - zizmor      — security audit of the workflows (template
    #                   injection, unpinned actions, dangerous triggers,
    #                   etc.). Configured via `zizmor.yml` at repo root.
    #   - hadolint    — Dockerfile best practices (exec CMD, numeric
    #                   USER, no apt pinning anti-patterns, etc.)
    #   - shellcheck  — shell scripts in scripts/vps/ and scripts/deploy.sh
    #
    # All four must pass for the deploy gate to fire. None of them need
    # the project source — they run on the workflow + Dockerfile +
    # script files only, so the job is fast (<60s typical).
    name: Workflow, Dockerfile, shell linters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: actionlint
        # Fast structural + syntax check on all 3 workflows. Surfaces
        # shellcheck-level findings inside the workflow's `run: |` blocks
        # (actionlint runs shellcheck internally) and undeclared inputs.
        uses: reviewdog/action-actionlint@v1.65.2
        with:
          level: error
        timeout-minutes: 3

      - name: zizmor
        # Security audit of the workflows. Uses the project-level
        # `zizmor.yml` config (which documents the accepted findings:
        # unpinned-uses and dangerous-triggers on deploy.yml). The
        # action exposes `persona:` and `min-severity:` as its own
        # inputs (NOT CLI flags — the action's `args:` input is
        # reserved for the inputs list, not flags). `persona: regular`
        # (errors only) + `min-severity: high` means accepted
        # warnings in zizmor.yml don't fail the gate.
        #
        # `advanced-security: false` skips the SARIF upload to GitHub
        # Advanced Security — laratik-planner is private and we don't
        # have Advanced Security on the free plan. Without this, the
        # step fails on "Resource not accessible by integration" because
        # the workflow needs `security-events: write` to upload SARIF,
        # and we don't want to grant that scope just to publish
        # findings. The findings are still in the action's stdout
        # and in the run summary.
        uses: zizmorcore/zizmor-action@v0.1.2
        with:
          inputs: .
          persona: regular
          min-severity: high
          advanced-security: false
        timeout-minutes: 5

      - name: hadolint
        # Dockerfile best-practices. The image is built from node:20-alpine
        # so the hadolint Debian image sees nothing to lint beyond what
        # the Dockerfile itself contains. v3.1.0 is the latest stable;
        # we pin to a specific minor because the `v3` floating tag is
        # not a published ref.
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
        timeout-minutes: 3

      - name: shellcheck (scripts/vps/*.sh + scripts/deploy.sh)
        # shellcheck is preinstalled on the GHA runner; use the system
        # binary rather than a third-party action to keep this step
        # reproducible. -S warning surfaces real bugs (ACME_OK=1
        # unused-var was one in renew-smtp-cert.sh) without noise.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/vps/*.sh scripts/deploy.sh
        timeout-minutes: 3
