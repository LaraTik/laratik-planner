name: CI

# Authoritative release-gate workflow. The deploy workflow only fires
# when this workflow is green on `main`, so every required release
# contract must run here:
#
#   1. format / lint / typecheck
#   2. unit + target coverage thresholds
#   3. integration + migration drill
#   4. production build + Docker smoke
#   5. Chromium critical E2E (functional + visual baseline)
#   6. zero critical/high production audit findings
#
# The full 5-browser E2E + visual matrix remains in the separate
# `.github/workflows/e2e.yml` workflow as a release-candidate check on
# PR + main; production deploy does not wait for it. See
# `docs/testing/strategy.md` (Release gates) for the contract.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-quality:
    name: Lint, typecheck, unit, integration, coverage, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner_ci
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test
      AUTH_SECRET: ci_secret_only_not_for_production_xxxxxxxxxxxxxxxx
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ci
      SMTP_PASSWORD: ci-only
      SMTP_FROM: "ci <ci@planner.test>"
      TEST_DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
        timeout-minutes: 5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15

      - name: Format check
        run: pnpm format:check
        timeout-minutes: 10

      - name: Lint
        run: pnpm lint
        timeout-minutes: 10

      - name: Typecheck
        run: pnpm typecheck
        timeout-minutes: 10

      - name: Apply migrations
        run: pnpm db:migrate
        timeout-minutes: 10

      - name: Unit tests
        run: pnpm test:unit -- --reporter=verbose
        timeout-minutes: 20

      - name: Integration tests
        run: pnpm test:integration
        timeout-minutes: 20

      - name: Coverage
        run: pnpm test:coverage
        timeout-minutes: 20

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
        timeout-minutes: 5

      - name: Dependency audit
        run: pnpm audit --prod
        timeout-minutes: 10

  browser-verify:
    name: Chromium critical E2E + visual baseline
    runs-on: ubuntu-latest
    needs: unit-quality
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner_ci
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test
      AUTH_SECRET: ci_secret_only_not_for_production_xxxxxxxxxxxxxxxx
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ci
      SMTP_PASSWORD: ci-only
      SMTP_FROM: "ci <ci@planner.test>"
      TEST_DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
        timeout-minutes: 5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15

      - name: Cache Playwright browsers
        # The critical visual gate depends on Chromium; cache the
        # browser install so the deploy gate stays fast on warm runs.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
        timeout-minutes: 5

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 15

      - name: Apply migrations
        run: pnpm db:migrate
        timeout-minutes: 10

      - name: Critical browser and visual tests
        # Runs after migrations, before the heavy build/Docker step
        # so a failing visual snapshot doesn't burn build minutes.
        run: pnpm test:e2e:critical
        timeout-minutes: 25

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-critical
          path: playwright-report/
          retention-days: 7
        timeout-minutes: 5

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-critical
          path: |
            tests/e2e/visual-regression.spec.ts-snapshots/reference/
            tests/e2e/visual-regression.spec.ts-snapshots/responsive/
          retention-days: 7
        timeout-minutes: 5

  build-smoke:
    name: Build, Docker image, health smoke
    runs-on: ubuntu-latest
    needs: [unit-quality, browser-verify]
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner_ci
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test
      AUTH_SECRET: ci_secret_only_not_for_production_xxxxxxxxxxxxxxxx
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ci
      SMTP_PASSWORD: ci-only
      SMTP_FROM: "ci <ci@planner.test>"
      TEST_DATABASE_URL: postgresql://planner:planner_ci@localhost:5432/planner_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
        timeout-minutes: 5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15

      - name: Build
        run: pnpm build
        timeout-minutes: 20

      - name: Build Docker image
        run: docker build -t laratik-planner:ci-${{ github.sha }} .
        timeout-minutes: 20

      - name: Smoke e2e (health)
        run: |
          docker run -d --rm \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e AUTH_SECRET=$AUTH_SECRET \
            -e DATABASE_URL=$DATABASE_URL \
            -e AUTH_URL=http://localhost:3000 \
            -e SMTP_HOST=localhost \
            -e SMTP_USER=ci \
            -e SMTP_PASSWORD=ci-only \
            -e SMTP_FROM='ci <ci@planner.test>' \
            --network host \
            --name laratik-planner-smoke \
            laratik-planner:ci-${{ github.sha }}
          # Wait for the container to start
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Health endpoint OK after ${i}s"
              curl -fsS http://localhost:3000/api/health
              docker stop laratik-planner-smoke
              exit 0
            fi
            sleep 1
          done
          echo "Smoke test failed: /api/health never responded"
          docker logs laratik-planner-smoke
          docker stop laratik-planner-smoke
          exit 1
        timeout-minutes: 5
