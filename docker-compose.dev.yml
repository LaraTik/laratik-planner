# ─────────────────────────────────────────────────────────────────────────────
# laratik-planner — LOCAL dev override
# Only the infra runs in Docker (Postgres). The app runs natively via
# `pnpm dev` for HMR speed. Production compose is docker-compose.yml.
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   pnpm dev
# ─────────────────────────────────────────────────────────────────────────────
name: laratik-planner-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: laratik-planner-pg-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner_dev_only
      POSTGRES_DB: planner
    ports:
      - "5432:5432"
    volumes:
      - ./tmp/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Mailpit — fake SMTP server that catches every email the app sends and
  # shows them in a web UI. Use this to test the magic-link sign-in flow
  # locally without a real mailbox. See docs/operations/local-dev.md.
  mailpit:
    image: axllent/mailpit:latest
    container_name: laratik-planner-mailpit-dev
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP — what Nodemailer connects to
      - "8025:8025" # Web UI — http://localhost:8025 to read captured mail
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1 # accept any user/pass (no real creds)
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
