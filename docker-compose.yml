# ─────────────────────────────────────────────────────────────────────────────
# laratik-planner — PRODUCTION compose
# Used on laratik-vps (217.154.124.83). Source of truth for the live stack.
# The app container is published to planner.laratik.com via the existing
# Traefik instance (network: traefik-public, labels below).
# Postgres is on a private internal network — never exposed to Traefik.
# ─────────────────────────────────────────────────────────────────────────────
name: laratik-planner

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/laratik/laratik-planner:${IMAGE_TAG:-latest}}
    pull_policy: always
    ports:
      - "3100:3000"
    restart: unless-stopped
    env_file: .env
    environment:
      APP_VERSION: ${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.laratik-planner.rule=Host(`planner.laratik.com`)
      # Traefik v3 names: entrypoint is `https` (not `websecure`), cert
      # resolver is `le` (not `letsencrypt`). Matching the v2 names silently
      # dropped the router so https://planner.laratik.com returned 404 even
      # with valid DNS + a working container.
      - traefik.http.routers.laratik-planner.entrypoints=https
      - traefik.http.routers.laratik-planner.tls=true
      - traefik.http.routers.laratik-planner.tls.certresolver=le
      # CRITICAL: pin upstream URL to the container name on traefik-public.
      # Without this, Traefik may pick the wrong network's IP and the
      # router silently fails to register. See AGENTS.md "Traefik upstream
      # pinning" and the vps-ops evo/bot compose files for the pattern.
      - traefik.http.services.laratik-planner.loadbalancer.server.url=http://laratik-planner-app-1:3000
      # Readiness probe for Traefik: hit /api/health/ready so a broken
      # DB connection removes the container from the load balancer
      # without restarting the process. Liveness (for autoheal + Docker
      # HEALTHCHECK below) stays on /api/health/live. See
      # docs/testing/strategy.md (Release gates).
      - traefik.http.services.laratik-planner.loadbalancer.healthcheck.path=/api/health/ready
      - traefik.http.services.laratik-planner.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.laratik-planner.loadbalancer.healthcheck.timeout=5s
      - traefik.http.middlewares.laratik-planner-secure.headers.stsSeconds=31536000
      - traefik.http.middlewares.laratik-planner-secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.laratik-planner-secure.headers.stsPreload=true
      - traefik.http.routers.laratik-planner.middlewares=laratik-planner-secure@docker
      - autoheal=true
      - autoheal.timeout=30
      - autoheal.restart=true
    healthcheck:
      # 127.0.0.1 (NOT localhost — IPv6 trap). Next.js binds 0.0.0.0
      # (IPv4), so a wget against "localhost" resolves to ::1 first and
      # gets connection-refused. Traefik's docker provider then
      # filters the container as "unhealthy or starting" and never
      # creates a router — so the planner subdomain 404s with no
      # visible error. Same trap called out in the vps-ops evolution /
      # whatsapp-bot compose files.
      #
      # Liveness only — a transient DB hiccup should not cause autoheal
      # to restart the container (that just churns the process and
      # makes the outage worse). The Traefik loadbalancer probes
      # /api/health/ready separately via the labels above, so the
      # container is removed from rotation on a DB outage without a
      # restart. See docs/testing/strategy.md (Release gates).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Bind mount for the SQLite Sentry cache (if used) and any local files
    volumes:
      - app-data:/app/data
      # Brand-kit logo / asset uploads (local-volume storage
      # adapter — see `src/lib/storage/`). The directory is
      # created + chowned to `nextjs:nodejs` at image build time
      # in the Dockerfile runtime stage so the app can write here
      # without sudo.
      - app-uploads:/data/uploads

  migrate:
    image: ${MIGRATOR_IMAGE:-ghcr.io/laratik/laratik-planner-migrator:${IMAGE_TAG:-latest}}
    pull_policy: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
    name: laratik-planner-pgdata
  app-data:
    name: laratik-planner-app-data
  app-uploads:
    name: laratik-planner-app-uploads

networks:
  internal:
    driver: bridge
  traefik-public:
    external: true
    name: traefik-public
