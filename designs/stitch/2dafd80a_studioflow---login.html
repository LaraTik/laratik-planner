<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Login - StudioFlow</title>

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        .spinner {
            animation: rotate 2s linear infinite;
        }
        
        .spinner .path {
            stroke: currentColor;
            stroke-linecap: round;
            animation: dash 1.5s ease-in-out infinite;
        }
        
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes dash {
            0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }
            100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; }
        }
    </style>
</head>
<body class="bg-canvas min-h-screen flex flex-col justify-center items-center p-screen-padding text-on-surface">
<div class="w-full max-w-[440px] flex flex-col gap-8">
<!-- Header -->
<div class="text-center flex flex-col gap-2">
<h1 class="font-page-title text-page-title text-primary font-bold">StudioFlow</h1>
<p class="font-body text-body text-text-muted">Plan, approve, and publish with clarity.</p>
</div>
<!-- Card -->
<div class="bg-surface rounded-lg border border-border p-8 flex flex-col gap-6 relative shadow-sm">
<!-- Error State Demo -->
<div class="bg-danger-subtle border border-danger/20 rounded-md p-3 flex items-start gap-3">
<span class="material-symbols-outlined text-danger text-[20px] shrink-0 mt-0.5">error</span>
<div class="flex flex-col">
<span class="font-label text-label text-danger font-semibold">Invalid credentials</span>
<span class="font-label text-label text-danger/80 font-normal">The email or password you entered is incorrect.</span>
</div>
</div>
<form class="flex flex-col gap-5">
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-on-surface" for="email">Email address</label>
<input class="h-10 px-3 rounded-DEFAULT border border-border focus:ring-2 focus:ring-focus-ring focus:border-focus-ring focus:outline-none transition-shadow font-body text-body placeholder:text-text-muted bg-surface w-full" id="email" placeholder="name@agency.com" type="email" value="alex@example.com"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label text-label text-on-surface" for="password">Password</label>
<a class="font-label text-label text-primary hover:text-primary-hover transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="h-10 pl-3 pr-10 rounded-DEFAULT border border-border focus:ring-2 focus:ring-focus-ring focus:border-focus-ring focus:outline-none transition-shadow font-body text-body placeholder:text-text-muted bg-surface w-full" id="password" placeholder="Enter your password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 px-3 flex items-center text-text-muted hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2">
<input class="w-4 h-4 rounded border-border text-primary focus:ring-focus-ring bg-surface cursor-pointer" id="remember" type="checkbox"/>
<label class="font-label text-label text-on-surface cursor-pointer" for="remember">Remember me for 30 days</label>
</div>
<!-- Actions -->
<div class="flex flex-col gap-3 mt-2">
<!-- Standard Sign In -->
<button class="h-10 bg-primary-container text-on-primary rounded-lg font-button text-button hover:bg-primary-hover transition-colors w-full flex items-center justify-center" type="button">
                        Sign in
                    </button>
<!-- Loading State Demo -->
<button class="h-10 bg-primary-container/80 text-on-primary rounded-lg font-button text-button cursor-wait w-full flex items-center justify-center gap-2" disabled="" type="button">
<svg class="spinner w-4 h-4" viewbox="0 0 50 50">
<circle class="path" cx="25" cy="25" fill="none" r="20" stroke-width="5"></circle>
</svg>
                        Signing in...
                    </button>
</div>
</form>
</div>
<!-- Footer Shell -->
<footer class="flex flex-col justify-center items-center gap-3">
<p class="font-label text-label text-secondary text-center">Need access? Contact your agency administrator.</p>
<div class="flex gap-4">
<a class="font-label text-label text-text-muted hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label text-label text-text-muted hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
<p class="font-label text-label text-text-muted text-center mt-2">© 2024 StudioFlow Agency Platform</p>
</footer>
</div>
<script>
        // Simple password toggle logic for the static demo
        document.querySelector('button[aria-label="Toggle password visibility"]').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        });
    </script>
</body></html>
