<!doctype html>
<html>
  <head>
    <title>Backup / Scripted Folder - Google Drive</title>
  </head>
  <body>
    <!-- Drive's newer markup omits the AF_initDataCallback blob and
     relies entirely on data-id + aria-label pairs. -->
    <div class="folder-content">
      <div data-id="2AAAAAAAAAAAAAAAAAA1" role="row">
        <span aria-label="Aerial shot.jpg"></span>
      </div>
      <div data-id="2AAAAAAAAAAAAAAAAAA2" role="row">
        <span aria-label="Backup.mp4"></span>
      </div>
      <div data-id="2AAAAAAAAAAAAAAAAAA3" role="row">
        <span aria-label="Notes.txt"></span>
      </div>
    </div>
  </body>
</html>
