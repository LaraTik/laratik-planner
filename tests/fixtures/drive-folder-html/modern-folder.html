<!doctype html>
<html>
  <head>
    <title>Driveway - Google Drive</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <!--
      Modern Drive HTML (post-2024 layout). The folder listing lives in
      `AF_initDataCallback({key: 'ds:4', ...})` with each file row shaped
      like:
          [null, "<fileId>"], null, null, null, "<mime>", null, ..., [meta]
      The legacy `[id, name, mime, size, hash, ...]` shape is gone. The
      filename appears in `data-tooltip="<name> <type>"` and an
      `aria-label="<name> <type> Shared"` on the name cell. The size
      appears in a separate column's `aria-label="Size: <n> MB"`.

      Each row carries ~3 `data-id` attributes (one on `<tr>`, one on
      the inner `<div>`, one on the icon). The parser must treat the
      entire row — not just the duplicate-data-id window — as one
      metadata scope, otherwise the name + size labels fall outside
      the search window and the wizard shows the file id as the name.
    -->
    <script>
      AF_initDataCallback({
        key: "ds:0",
        hash: "1",
        data: [],
        sideChannel: {},
      });
      AF_initDataCallback({
        key: "ds:4",
        hash: "5",
        data: [
          [
            [null, "1EX3YWNgXEs9UHAfE8uACdYfdJlRZQwGb"],
            null,
            null,
            null,
            "image/png",
            null,
            null,

            1,
            null,
            null,
            null,
            [[2]],

            null,
            null,
            null,
            null,
            null,
            [1, "1"],
            null,
            [
              [[""], [null, ["image/png"]], null, null, null, "Image"],
              null,
              [
                [
                  16,
                  null,
                  [null, [[["1-1.png", null, 1]]]],
                  null,
                  null,
                  [[["1-1.png", null, 1], ["Image"]]],
                  null,
                  null,
                  1,
                  [[["1-1.png"], ["Image"], ["Shared"]]],
                ],
                [
                  2,
                  null,
                  [null, [[["20. Sept."]]]],
                  null,
                  null,
                  [[["20. Sept."]]],
                  null,
                  null,
                  1,

                  1,
                  null,
                  [null, [[["2,2 MB"]]]],
                  null,
                  null,
                  [[["Size: 2,2 MB\nStorage used: 2,2 MB"]]],
                  null,
                  null,
                  1,
                  [[["Size: 2,2 MB\nStorage used: 2,2 MB"]]],
                ],
                [18, null, null, null, null, null, null, null, 1],
              ],
            ],
            [55465, "image/png", []],
          ],
          [
            [null, "1dDiio5t_5Q2x1Zz-My9r31ovTfxRHZS6"],
            null,
            null,
            null,
            "image/png",
            null,
            null,
            null,

            null,
            null,
            1,
            null,
            null,
            null,
            [[2]],
            null,

            [1, "1"],

            [
              [[""], [null, ["image/png"]], null, null, null, "Image"],

                  [[["2-1.png", null, 1], ["Image"]]],
                  null,

                  [[["2-1.png"], ["Image"], ["Shared"]]],

    <!--
      Modern Drive markup: <tr data-id="..."> with three data-id attributes
      per row (one on the <tr>, one on the icon <div>, one on the cell
      wrapper), then a name cell with `aria-label="<name> Image Shared"`
      and `data-tooltip="<name> Image"`, then a "Modified" cell, then a
      "Size" cell with `aria-label="Size: <n> MB\nStorage used: <n> MB"`.
    -->
    <div class="folder-content">
      <table>
        <tbody>
          <tr
            data-id="1EX3YWNgXEs9UHAfE8uACdYfdJlRZQwGb"
            role="row"
            class="qwPkcb"
          >
            <td>
              <div
                aria-label="1-1.png Image Shared"
                data-id="1EX3YWNgXEs9UHAfE8uACdYfdJlRZQwGb"
                data-tooltip="1-1.png Image"
              >
                <strong class="DNoYtb">1-1.png</strong>
              </div>
              <span aria-label="Freigegeben">Shared</span>
            </td>
            <td>
              <span aria-label="Modified 20. Sept.">20. Sept.</span>
            </td>
            <td>
              <span aria-label="Size: 2,2 MB&#10;Storage used: 2,2 MB"
                >2,2 MB</span
              >
            </td>
          </tr>
          <tr
            data-id="1dDiio5t_5Q2x1Zz-My9r31ovTfxRHZS6"
            role="row"
            class="qwPkcb"
          >
            <td>
              <div
                aria-label="2-1.png Image Shared"
                data-id="1dDiio5t_5Q2x1Zz-My9r31ovTfxRHZS6"
                data-tooltip="2-1.png Image"
              >
                <strong class="DNoYtb">2-1.png</strong>
              </div>
            </td>
            <td>
              <span aria-label="Modified 20. Sept.">20. Sept.</span>
            </td>
            <td>
              <span aria-label="Size: 2 MB&#10;Storage used: 2 MB">2 MB</span>
            </td>
          </tr>
          <tr
            data-id="1AcZYycV8J6wWHBhelQQdz3y9d4mEwjrw"
            role="row"
            class="qwPkcb"
          >
            <td>
              <div
                aria-label="3-1.mp4 Video Shared"
                data-id="1AcZYycV8J6wWHBhelQQdz3y9d4mEwjrw"
                data-tooltip="3-1.mp4 Video"
              >
                <strong class="DNoYtb">3-1.mp4</strong>
              </div>
            </td>
            <td>
              <span aria-label="Modified 20. Sept.">20. Sept.</span>
            </td>
            <td>
              <span aria-label="Size: 9,4 MB&#10;Storage used: 9,4 MB"
                >9,4 MB</span

            </td>
          </tr>
          <tr
            data-id="1H-4vAL4EqQqGuuq8CoWjStYRe_rdNSx3"
            role="row"
            class="qwPkcb"
          >
            <td>
              <div
                aria-label="4-1.pdf PDF Shared"
                data-id="1H-4vAL4EqQqGuuq8CoWjStYRe_rdNSx3"
                data-tooltip="4-1.pdf PDF"
              >
                <strong class="DNoYtb">4-1.pdf</strong>

            </td>
