[project]
name = "laratik-trends"
version = "0.1.0"
description = "Trend Radar sidecar — extracts, normalises, scores, and serves cross-platform social trends for the laratik planner."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "laratik" }]

dependencies = [
  "fastapi==0.115",
  "uvicorn[standard]==0.32",
  "sqlalchemy[asyncio]==2.0",
  "asyncpg==0.30",
  "httpx==0.27",
  "pydantic==2.9",
  "pydantic-settings==2.6",
  "apscheduler==3.11",
  "python-dotenv==1.0",
  "langdetect==1.0.9",
  "rapidfuzz==3.10",
  "vaderSentiment==3.3.2",
  "detoxify==0.5.2",
  "sentence-transformers==3.2",
  "transformers==4.46",
  "torch==2.4",
  "prometheus-client==0.21",
  "structlog==24.4",
  "tenacity==9.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3",
  "pytest-asyncio==0.24",
  "pytest-cov==5.0",
  "vcrpy==6.0",
  "ruff==0.7",
]

# Convenience tasks. If the `task` runner (taskipy) is installed
# (`pip install taskipy`) you can run `task dev`, `task start`, `task test`.
# Without it, use the equivalent commands shown in the README.
[tool.taskipy.tasks]
dev = "uvicorn app.main:app --reload --port 8010"
start = "uvicorn app.main:app --host 0.0.0.0 --port 8010"
test = "pytest -v"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.extractor", "app.analysis", "app.fit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "PT"]
ignore = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/__init__.py"]
